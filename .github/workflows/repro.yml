name: repro

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.os }} php ${{ matrix.php }} unload=${{ matrix.unload }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        php: ['8.4', '8.5']
        unload: ['yes', 'no']
    env:
      RUNS: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: grpc
          coverage: none

      - name: Versions
        run: |
          php -v
          php --ri grpc
          ls -l "$(php -r 'echo ini_get("extension_dir");')/grpc.so"

      # setup-php unpacks a prebuilt PHP tarball from shivammathur/php-ubuntu,
      # and grpc.so comes inside it, not from a package. The build strips
      # .comment, but the matching -dbgsym tarball has the debug info, and
      # DW_AT_producer there records the compiler and its flags.
      - name: Provenance
        continue-on-error: true
        run: |
          so="$(php -r 'echo ini_get("extension_dir");')/grpc.so"
          tarball=$(ls /tmp/php_*.tar.zst)
          tar -I zstd -tvf "$tarball" | grep grpc.so
          readelf -d "$so" | grep -i flags
          id=$(readelf -n "$so" | awk '/Build ID/ { print $3 }')
          echo "build id: $id"
          dbgsym=$(basename "${tarball/-nts+/-nts-dbgsym+}")
          curl -fsSL -o /tmp/dbgsym.tar.zst \
            "https://github.com/shivammathur/php-ubuntu/releases/download/builds/$dbgsym"
          mkdir /tmp/dbgsym
          tar -I zstd -xf /tmp/dbgsym.tar.zst -C /tmp/dbgsym --wildcards "*/${id:0:2}/${id:2}.debug"
          readelf --debug-dump=info "$(find /tmp/dbgsym -name "${id:2}.debug")" \
            | grep -m 5 DW_AT_producer

      # %e is the name of the thread that faulted, so the core file names
      # alone show which thread crashes.
      - name: Write core dumps to /tmp
        run: sudo sysctl -w kernel.core_pattern='/tmp/core.%p.%e'

      # ZEND_DONT_UNLOAD_MODULES makes PHP skip dlclose() on extensions at
      # shutdown. If the crash goes away with it set, the unload is the cause.
      - name: Run ${{ env.RUNS }} times
        run: |
          [ "${{ matrix.unload }}" = "no" ] && export ZEND_DONT_UNLOAD_MODULES=1
          ulimit -c unlimited
          crashes=0
          for i in $(seq "$RUNS"); do
            php repro.php > /dev/null && rc=0 || rc=$?
            [ "$rc" -ne 0 ] && crashes=$((crashes + 1)) && echo "run $i: exit $rc"
          done
          echo "crashes: $crashes/$RUNS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$crashes" -eq 0 ]

      # Running under gdb changes the timing enough to hide the race, so read
      # a core from one of the crashes above instead.
      - name: Backtrace
        if: failure()
        run: |
          ls /tmp/core.*
          core=$(ls /tmp/core.* | head -n 1)
          sudo apt-get install -y -qq gdb > /dev/null
          gdb -q -batch \
            -ex 'p $_siginfo._sifields._sigfault.si_addr' \
            -ex 'info sharedlibrary grpc' \
            -ex 'thread apply all bt 8' \
            "$(command -v php)" "$core"
